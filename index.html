<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Looper - Create Live Loops Online Easily</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Discover Live Looper, a user-friendly tool to create live loops effortlessly. Perfect for musicians looking to loop without complex software or expensive equipment. Try it now!">
    <meta name="google-site-verification" content="DijojHe8fh322TPKLBJmVLoTAQF6-8UKTCu3q3_QkUY" />
</head>
<body>
    <div class="container">
        <img src="logonew.png" alt="Live Looper Logo">
        <h1>Live Looper</h1>
        
        <div class="bpm-control">
            <label for="bpm">BPM:</label>
            <input type="number" id="bpm" value="80" min="20" max="200">
        </div>
        
        <div id="loop-sets">
            <h2>Loop Sets</h2>
            <div id="loop-sets-controls">
                <button id="new-set">New Set</button>
                <button id="previous-set">Previous Set</button>
                <button id="next-set">Next Set</button>
                <button id="move-set-up">Move Set Up</button>
                <button id="move-set-down">Move Set Down</button>
            </div>
            <div id="set-name">Set 1</div>
            <div id="loop-sets-list"></div>
        </div>
        
        <div class="controls">
            <button id="record">Record</button>
            <button id="play">Play</button>
        </div>
        
        <div id="countdown-container">
            <div id="countdown">4</div>
        </div>
        
        <div id="beat-indicators">
            <div class="beat-indicator"></div>
            <div class="beat-indicator"></div>
            <div class="beat-indicator"></div>
            <div class="beat-indicator"></div>
        </div>
        
        <hr class="divider">
        
        <div id="loops"></div>
    </div>
    
    <audio id="metronome-sound" src="metronome.mp3" preload="auto"></audio>
    <audio id="start-sound" src="start.mp3" preload="auto"></audio>
    <audio id="stop-sound" src="stop.mp3" preload="auto"></audio>
    
    <script src="https://cdn.socket.io/4.1.3/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
